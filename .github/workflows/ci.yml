name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      # Backend tests import both `from app.main import ...` and
      # `from backend.app... import ...`, so both the repo root and
      # backend/ must be importable. Run from the root with this path.
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches backend/Dockerfile (python:3.12-slim)
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend test suite
        run: python -m pytest backend/tests -v

  frontend-tests:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend test suite
        working-directory: frontend
        run: npm test
