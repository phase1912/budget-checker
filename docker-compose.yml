services:
  backend:
    build: ./backend
    # Fix for fix-docker-bcrypt-missing (root_cause#114): a bare `docker compose up`
    # used to reuse a stale, cached backend image built before `bcrypt` was added
    # to requirements.txt, crashing at startup with ModuleNotFoundError. `build`
    # pull_policy forces the image to be rebuilt from the current tree on every
    # `up`, so a dependency added to requirements.txt can never be missing.
    pull_policy: build
    ports:
      - "8000:8000"
    environment:
      # Absolute path on the named volume so data survives down/up.
      DATABASE_URL: sqlite:////data/budget_checker.db
      ALLOWED_ORIGINS: http://localhost:5174
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  backend_data:
