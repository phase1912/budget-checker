services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Absolute path on the named volume so data survives down/up.
      DATABASE_URL: sqlite:////data/budget_checker.db
      ALLOWED_ORIGINS: http://localhost:5174
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  backend_data:
